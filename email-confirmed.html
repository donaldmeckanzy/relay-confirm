<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmed - Relay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        h1 {
            color: #1a1a1a;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            margin-bottom: 15px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .secondary {
            color: #667eea;
            font-size: 14px;
            margin-top: 20px;
        }
        
        .secondary a {
            color: #667eea;
            text-decoration: underline;
        }
        
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: #f0f9ff;
            color: #0369a1;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 20px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .container {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>Email Confirmed!</h1>
        <p>Your email has been successfully verified. You can now sign in to Relay and start tracking your productivity.</p>
        
        <button class="button" onclick="openApp()">
            Open Relay App
        </button>
        
        <div class="status" id="status">
            Attempting to open Relay...
        </div>
        
        <p class="secondary">
            App didn't open? <a href="#" onclick="openApp(); return false;">Try again</a>
            <br><br>
            Or close this window and open Relay manually from your Applications folder.
        </p>
    </div>

    <script>
        function openApp() {
            const statusEl = document.getElementById('status');
            
            // Try to open the app using custom protocol
            window.location.href = 'relay://auth/confirmed';
            
            statusEl.textContent = '✓ Opening Relay...';
            statusEl.style.background = '#dcfce7';
            statusEl.style.color = '#166534';
            
            // Fallback message after 3 seconds
            setTimeout(() => {
                statusEl.textContent = 'If the app didn\'t open, launch it manually';
                statusEl.style.background = '#fef3c7';
                statusEl.style.color = '#92400e';
            }, 3000);
        }
        
        // Auto-attempt to open the app on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Wait 1 second before attempting to open (gives user time to see success message)
            setTimeout(() => {
                openApp();
            }, 1000);
        });
    </script>
</body>
</html>
